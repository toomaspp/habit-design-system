  <div style="padding: 12px 24px 0;">
    <div class="eyebrow">Last 7 days</div>
    <h1 class="display">Stats</h1>
  </div>

  <div class="stat-tiles" style="margin-top: 24px;">
    <div class="stat-tile"><span class="value">12</span><span class="caption">Day streak</span></div>
    <div class="stat-tile"><span class="value">21</span><span class="caption">Best streak</span></div>
    <div class="stat-tile"><span class="value">84%</span><span class="caption">Completion</span></div>
  </div>

  <section class="card" style="margin: 12px 24px 0;">
    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <span class="eyebrow">Habits completed</span>
      <span class="body-text" style="font-size: var(--text-label);">29 / 35</span>
    </div>
    <div style="display:flex; align-items:flex-end; gap:12px; height:96px; margin-top:18px;">
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:100%; height:88px; border-radius:var(--radius-sm); background:var(--color-ink-15);"></div>
        <span class="caption">M</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:100%; height:53px; border-radius:var(--radius-sm); background:var(--color-accent-primary);"></div>
        <span class="caption" style="color: var(--color-ink); font-weight: var(--font-weight-semibold);">T</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:100%; height:70px; border-radius:var(--radius-sm); background:var(--color-ink-15);"></div>
        <span class="caption">W</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:100%; height:88px; border-radius:var(--radius-sm); background:var(--color-ink-15);"></div>
        <span class="caption">T</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:100%; height:35px; border-radius:var(--radius-sm); background:var(--color-ink-15);"></div>
        <span class="caption">F</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:100%; height:70px; border-radius:var(--radius-sm); background:var(--color-ink-15);"></div>
        <span class="caption">S</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:100%; height:18px; border-radius:var(--radius-sm); background:var(--color-ink-15);"></div>
        <span class="caption">S</span>
      </div>
    </div>
  </section>

  <section style="margin: 28px 24px 0;">
    <div class="eyebrow" style="margin-bottom: 12px;">By habit</div>
    <div class="card" style="display:flex; flex-direction:column; gap:14px;">
      <div>
        <div style="display:flex; justify-content:space-between;"><span class="body-text">Meditate</span><span class="caption">100%</span></div>
        <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:100%;"></div></div>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between;"><span class="body-text">Drink water</span><span class="caption">86%</span></div>
        <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:86%;"></div></div>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between;"><span class="body-text">Read</span><span class="caption">57%</span></div>
        <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:57%;"></div></div>
      </div>
    </div>
  </section>

  <div class="card" style="margin: 24px 24px 0; background: var(--color-ink-8); display:flex; align-items:center; gap:10px;">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px; color: var(--color-ink);"><path d="M12 2.5c-3.6 4.2-6 7.3-6 10.5a6 6 0 1 0 12 0c0-3.2-2.4-6.3-6-10.5Z"/></svg>
    <span class="caption" style="color: var(--color-ink);">You're most consistent on Mondays and Thursdays.</span>
  </div>

      Home
    </a>
    <a class="tab tab--active" href="stats.html">

    <a class="tab tab--inactive" href="profile.html">

      Profile

  </nav>
