  <div class="header">
    <div>
      <div class="eyebrow">Tuesday, Aug 25</div>
      <h1 class="display">Morning,<br>Elena</h1>
    </div>
    <div class="avatar" aria-hidden="true">E</div>
  </div>

  <section class="card--hero">
    <div>
      <div class="eyebrow">Today's progress</div>
      <div style="font-size: var(--text-title); font-weight: var(--font-weight-semibold); margin-top: 8px;">3 of 5 done</div>
      <div class="caption" style="margin-top: 8px;">Two more to hit your streak</div>
    </div>
    <div aria-hidden="true" style="width:64px;height:64px;border-radius:var(--radius-full);
      background:conic-gradient(var(--color-accent-primary) 0% 60%, var(--color-snow-15) 60% 100%);
      display:flex;align-items:center;justify-content:center;">
      <div style="width:50px;height:50px;border-radius:var(--radius-full);background:var(--color-ink);
        display:flex;align-items:center;justify-content:center;color:var(--color-bg);font-weight:var(--font-weight-semibold);">60%</div>
    </div>
  </section>

  <section style="padding: 28px 24px 12px; display:flex; align-items:center; justify-content:space-between;">
    <span class="eyebrow">Your habits</span>
    <a class="link" href="#">See all</a>

        <div class="body-text">Meditate</div>
        <div class="caption">10 min · Morning</div>
      </div>
      <div class="habit-check habit-check--done">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
    </li>
    <li class="habit-row">
      <div class="habit-icon">

      </div>
      <div style="flex:1;">
        <div class="body-text">Drink water</div>
        <div class="caption">8 glasses · All day</div>

      </div>
      <div style="flex:1;">
        <div class="body-text">Read</div>
        <div class="caption">20 pages · Evening</div>
      </div>
      <div class="habit-check habit-check--pending"></div>
    </li>
    <li class="habit-row habit-row--ghost">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;"><path d="M12 5v14M5 12h14"/></svg>
      <span class="body-text" style="color: var(--color-muted);">Add a habit</span>
    </li>
